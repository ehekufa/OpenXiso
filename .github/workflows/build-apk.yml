# Автоматическая сборка APK на раннерах GitHub Actions.
# Сборка выполняется НЕ в песочнице агента: достаточно запушить код на ветку,
# и workflow сам поставит JDK, Android SDK/NDK/CMake, соберёт libopenxiso.so
# и выложит готовые APK во вкладку Artifacts запуска.
name: Сборка APK OpenXiso

on:
  push:
    branches:
      - arena/47099952-openxiso
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'preview/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      variant:
        description: 'Какой вариант APK собрать'
        required: true
        default: both
        type: choice
        options:
          - both
          - debug
          - release

# Артефакты записываются через ACTIONS_RUNTIME_TOKEN; для релиза права
# повышаются отдельно в job release.
permissions:
  contents: read

concurrency:
  group: openxiso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Ядро на C проверяется отдельно и вообще не требует Android SDK.
  # ------------------------------------------------------------------
  native-tests:
    name: Тесты C-ядра (хостовый gcc)
    runs-on: ubuntu-24.04
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5

      - name: Компиляция и запуск тестов ядра
        run: make -C app/src/main/cpp/tests run

  # ------------------------------------------------------------------
  # Основная сборка: Java + NDK/CMake -> APK.
  # ------------------------------------------------------------------
  apk:
    name: Сборка APK (Java + C/C++)
    runs-on: ubuntu-24.04
    needs: native-tests
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5

      - name: Установка JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Раннер Ubuntu 24.04 уже содержит Android SDK и cmdline-tools.
      # Внешний экшен setup-android не используется: он вызывает устаревший
      # пакет "tools" и падает на современном репозитории SDK.
      - name: Подготовка Android SDK, NDK и CMake
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_SDK/cmdline-tools/tools/bin/sdkmanager" \
            "$ANDROID_SDK/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then SDKMANAGER="$candidate"; break; fi
          done
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager не найден в $ANDROID_SDK" >&2
            ls -la "$ANDROID_SDK" >&2
            exit 1
          fi
          echo "Используется: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --install \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Права на запуск Gradle Wrapper
        run: chmod +x gradlew

      - name: Сборка отладочного APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant != 'release' }}
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Сборка release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant != 'debug' }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Проверка состава APK
        run: |
          set -euo pipefail
          echo "Собранные файлы:"
          ls -lh app/build/outputs/apk/*/*.apk

          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK" ]]; then
            echo "Отладочный APK не найден" >&2
            exit 1
          fi
          echo "Ключевые записи внутри APK:"
          unzip -l "$APK" | grep -E 'classes.dex|lib/.*/libopenxiso.so|AndroidManifest.xml|resources.arsc' || true
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! unzip -l "$APK" | grep -q "lib/$abi/libopenxiso.so"; then
              echo "Отсутствует libopenxiso.so для $abi" >&2
              exit 1
            fi
            echo "Нативная библиотека для $abi: присутствует"
          done
          {
            echo "### APK собран и проверен"
            echo ""
            echo "| Файл | Размер |"
            echo "| --- | --- |"
            for file in app/build/outputs/apk/*/*.apk; do
              echo "| $(basename "$file") | $(du -h "$file" | cut -f1) |"
            done
            echo ""
            echo "Нативные библиотеки: arm64-v8a, armeabi-v7a, x86_64."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Публикация отладочного APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: openxiso-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Публикация release APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: openxiso-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Итог
        run: echo "Готовые APK доступны во вкладке Artifacts этого запуска."

  # ------------------------------------------------------------------
  # При пуше тега v* APK дополнительно прикрепляются к GitHub Release.
  # ------------------------------------------------------------------
  release:
    name: Публикация APK в Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Скачивание артефактов сборки
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Создание Release с APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.apk \
            --title "OpenXiso ${GITHUB_REF_NAME}" \
            --generate-notes
