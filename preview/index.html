<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenXiso — макет интерфейса</title>
<style>
/* Базовые токены палитры из спецификации Material 3 */
:root {
  --blue: #1A73E8;
  --white: #FFFFFF;
  --secondary: #F1F3F4;
  --almost-white: #F8F9FA;
  --outline: #DADCE0;
  --text-primary: #202124;
  --text-secondary: #5F6368;
  --error: #D93025;
  --font: "Google Sans", "Product Sans", Roboto, "Segoe UI", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: var(--white);
  color: var(--text-primary);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none !important; }

/* Экран 1: системный инициализатор */
.screen { min-height: 100vh; }

#loader {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
}

.loaderStack {
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid var(--secondary);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Ровно 24 px между индикатором и текстовым блоком */
.bootMessage {
  margin-top: 24px;
  min-height: 28px;
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 0.1px;
  line-height: 1.5;
  color: var(--text-primary);
  animation: fade 320ms ease;
}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.bootStep {
  margin-top: 8px;
  font-size: 12px;
  letter-spacing: 0.3px;
  color: var(--text-secondary);
}

/* Экран 2: рабочее пространство */
.workspaceHeader {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 20px 24px;
}

.brandMark {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.brandTitle { font-size: 20px; font-weight: 500; letter-spacing: 0; line-height: 1.4; }
.brandSubtitle { font-size: 12px; color: var(--text-secondary); letter-spacing: 0.3px; }
.brandCounter { margin-left: auto; font-size: 14px; font-weight: 500; color: var(--text-secondary); }
.headerText { min-width: 0; }

.divider { height: 1px; background: var(--outline); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 120px);
  gap: 16px;
  padding: 24px;
}

/* Плитка «плюс»: 120 × 120, рамка 1 dp, скругление 16 dp */
.tile {
  position: relative;
  width: 120px;
  height: 120px;
  border: 1px solid var(--outline);
  border-radius: 16px;
  background: var(--white);
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 160ms ease;
}

.tile:hover { background: var(--almost-white); }
.tile:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.tileConfig {
  background: var(--secondary);
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: stretch;
  cursor: default;
}

.tileConfig:hover { background: var(--secondary); }
.configName { font-size: 14px; font-weight: 500; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.configFile { margin-top: 4px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Материальная рябь при нажатии */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(26, 115, 232, 0.16);
  transform: scale(0);
  animation: rippleAnim 520ms ease-out forwards;
  pointer-events: none;
}

@keyframes rippleAnim { to { transform: scale(2.6); opacity: 0; } }

/* Экран 3: модальное окно конфигурации */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(32, 33, 36, 0.32);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 20;
}

.dialog {
  width: 100%;
  max-width: 480px;
  background: var(--white);
  border-radius: 28px;
  padding: 28px;
  box-shadow: 0 8px 28px rgba(32, 33, 36, 0.16);
  animation: dialogIn 220ms ease-out;
}

@keyframes dialogIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }

.dialogTitle { margin: 0; font-size: 24px; font-weight: 500; line-height: 1.33; }
.dialogDescription { margin: 8px 0 0; font-size: 14px; line-height: 1.43; color: var(--text-secondary); }

/* Плоское outlined-поле с плавающей подписью */
.field { position: relative; margin-top: 24px; }

.field input {
  width: 100%;
  height: 56px;
  padding: 18px 16px 6px;
  border: 1px solid var(--outline);
  border-radius: 12px;
  outline: none;
  background: transparent;
  font-family: var(--font);
  font-size: 16px;
  color: var(--text-primary);
  transition: border-color 180ms ease, box-shadow 180ms ease;
}

.field label {
  position: absolute;
  left: 16px;
  top: 17px;
  font-size: 16px;
  color: var(--text-secondary);
  pointer-events: none;
  transition: transform 160ms ease, font-size 160ms ease, color 160ms ease;
}

.field input:focus { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.field input:focus + label,
.field input:not(:placeholder-shown) + label { transform: translateY(-12px); font-size: 12px; }
.field input:focus + label { color: var(--blue); }
.field input::placeholder { color: transparent; }

/* Крупный контейнер выбора файла */
.fileBox {
  position: relative;
  margin-top: 20px;
  min-height: 180px;
  padding: 24px;
  border-radius: 16px;
  background: var(--almost-white);
  border: 1.5px dashed var(--outline);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  transition: background-color 160ms ease;
}

.fileBox:hover { background: var(--secondary); }
.fileHint { margin-top: 16px; max-width: 300px; font-size: 14px; line-height: 1.43; color: var(--text-secondary); }
.fileSelected { margin-top: 12px; max-width: 300px; font-size: 12px; font-weight: 500; color: var(--blue); word-break: break-all; }
.fileError { margin-top: 8px; font-size: 12px; color: var(--error); }

.actions { margin-top: 28px; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }

.textButton, .filledButton {
  font-family: var(--font);
  font-size: 14px;
  font-weight: 500;
  border: 0;
  cursor: pointer;
  border-radius: 20px;
}

.textButton { padding: 10px 16px; background: transparent; color: var(--text-secondary); }
.textButton:hover { background: var(--secondary); }
.filledButton { padding: 12px 24px; background: var(--blue); color: var(--white); }
.filledButton:hover:not(:disabled) { background: #1765CC; }
.filledButton:disabled { background: var(--secondary); color: var(--text-secondary); cursor: default; }

/* Вспомогательная навигация для ревью макета (не часть интерфейса приложения) */
.demoNav {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 40;
  padding: 10px 12px;
  border: 1px solid var(--outline);
  border-radius: 12px;
  background: var(--white);
  box-shadow: 0 2px 10px rgba(32, 33, 36, 0.08);
  font-size: 11px;
  color: var(--text-secondary);
}

.demoNavTitle { margin-bottom: 8px; letter-spacing: 0.3px; }
.demoNavButtons { display: flex; flex-wrap: wrap; gap: 6px; }

.demoNav button {
  font-family: var(--font);
  font-size: 11px;
  padding: 6px 10px;
  border: 1px solid var(--outline);
  border-radius: 8px;
  background: var(--almost-white);
  color: var(--text-primary);
  cursor: pointer;
}

.demoNav button:hover { border-color: var(--blue); color: var(--blue); }

@media (max-width: 520px) {
  .dialog { padding: 24px; }
  .workspaceHeader { flex-wrap: wrap; }
  .brandCounter { width: 100%; margin-left: 0; }
}
</style>
</head>
<body>

<!-- Экран инициализации -->
<section id="loader" class="screen">
  <div class="loaderStack">
    <div class="spinner" role="progressbar" aria-label="Инициализация системы"></div>
    <div id="bootMessage" class="bootMessage">Загрузка архитектурных библиотек...</div>
    <div id="bootStep" class="bootStep">Шаг 1 из 5</div>
  </div>
</section>

<!-- Рабочее пространство -->
<section id="workspace" class="screen hidden">
  <header class="workspaceHeader">
    <div class="brandMark">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#FFFFFF" d="M10.5,3 h3 v7.5 h7.5 v3 h-7.5 v7.5 h-3 v-7.5 h-7.5 v-3 h7.5 z"></path>
      </svg>
    </div>
    <div class="headerText">
      <div class="brandTitle">OpenXiso</div>
      <div class="brandSubtitle">Виртуальные машины и образы дисков</div>
    </div>
    <div id="brandCounter" class="brandCounter">Конфигураций: 0</div>
  </header>
  <div class="divider"></div>
  <div id="grid" class="grid">
    <div id="plusTile" class="tile" role="button" tabindex="0" aria-label="Создать конфигурацию">
      <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#1A73E8" d="M10.5,3 h3 v7.5 h7.5 v3 h-7.5 v7.5 h-3 v-7.5 h-7.5 v-3 h7.5 z"></path>
      </svg>
    </div>
  </div>
</section>

<!-- Модальное окно конфигурации -->
<div id="dialogOverlay" class="overlay hidden">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <h1 id="dialogTitle" class="dialogTitle">Новая конфигурация</h1>
    <p class="dialogDescription">Укажите название системы и выберите файл образа диска.</p>

    <div class="field">
      <input id="osName" type="text" placeholder=" " autocomplete="off" aria-label="Название операционной системы">
      <label for="osName">Название операционной системы</label>
    </div>

    <div id="fileBox" class="fileBox" role="button" tabindex="0" aria-label="Выбрать файл образа">
      <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#F8F9FA" stroke="#1A73E8" stroke-width="2" stroke-linejoin="round"
              d="M12,4 L29,4 L37,12 L37,40 A4,4 0 0 1 33,44 L12,44 A4,4 0 0 1 8,40 L8,8 A4,4 0 0 1 12,4 Z"></path>
        <path fill="#F1F3F4" stroke="#1A73E8" stroke-width="2" stroke-linejoin="round" d="M29,4 L29,12 L37,12 Z"></path>
        <path fill="#1A73E8" d="M14,21 H34 V23 H14 Z"></path>
        <path fill="#DADCE0" d="M14,27 H34 V29 H14 Z"></path>
        <path fill="#DADCE0" d="M14,33 H28 V35 H14 Z"></path>
      </svg>
      <div class="fileHint">Нажмите здесь, чтобы выбрать файл образа (.iso, .img)</div>
      <div id="fileSelected" class="fileSelected hidden"></div>
    </div>
    <div id="fileError" class="fileError hidden"></div>

    <div class="actions">
      <button id="cancelButton" class="textButton">Отмена</button>
      <button id="createButton" class="filledButton" disabled>Создать</button>
    </div>
  </div>
</div>

<!-- Скрытый системный выбор файла: в Android эту роль выполняет SAF -->
<input id="fileInput" type="file" accept=".iso,.img" hidden>

<!-- Панель быстрого переклюления состояний, доступная только в макете -->
<nav class="demoNav">
  <div class="demoNavTitle">Навигация по макету (только для ревью)</div>
  <div class="demoNavButtons">
    <button data-view="loader">Загрузчик</button>
    <button data-view="workspace">Рабочее пространство</button>
    <button data-view="dialog">Диалог</button>
    <button data-view="reset">Сброс</button>
  </div>
</nav>

<script>
/* Логика макета повторяет конечный автомат из MainActivity.kt и EmulatorUiState.kt */

const bootMessages = [
  "Загрузка архитектурных библиотек...",
  "Инициализация JIT-ядра x86_64...",
  "Картирование страничной памяти MMU...",
  "Монтирование виртуальных накопителей...",
  "Проверка устройств PCI и USB..."
];

const STEP_DURATION_MS = 2500;

let bootTimer = null;
let bootIndex = 0;
let selectedFileName = null;
let nextConfigurationId = 1;

const loaderScreen = document.getElementById("loader");
const workspaceScreen = document.getElementById("workspace");
const bootMessageNode = document.getElementById("bootMessage");
const bootStepNode = document.getElementById("bootStep");
const grid = document.getElementById("grid");
const plusTile = document.getElementById("plusTile");
const brandCounter = document.getElementById("brandCounter");
const dialogOverlay = document.getElementById("dialogOverlay");
const osNameInput = document.getElementById("osName");
const fileBox = document.getElementById("fileBox");
const fileInput = document.getElementById("fileInput");
const fileSelectedNode = document.getElementById("fileSelected");
const fileErrorNode = document.getElementById("fileError");
const createButton = document.getElementById("createButton");
const cancelButton = document.getElementById("cancelButton");

/* Показ одного из экранов */
function showScreen(name) {
  loaderScreen.classList.toggle("hidden", name !== "loader");
  workspaceScreen.classList.toggle("hidden", name !== "workspace");
}

/* Циклический загрузчик: пять сообщений по 2,5 с, затем рабочее пространство */
function renderBootStep() {
  bootMessageNode.textContent = bootMessages[bootIndex];
  bootStepNode.textContent = "Шаг " + (bootIndex + 1) + " из " + bootMessages.length;
  /* Перезапуск анимации появления строки */
  bootMessageNode.style.animation = "none";
  void bootMessageNode.offsetWidth;
  bootMessageNode.style.animation = "";
}

function startLoader() {
  clearInterval(bootTimer);
  bootIndex = 0;
  showScreen("loader");
  renderBootStep();
  bootTimer = setInterval(() => {
    bootIndex += 1;
    if (bootIndex >= bootMessages.length) {
      clearInterval(bootTimer);
      bootTimer = null;
      showScreen("workspace");
      return;
    }
    renderBootStep();
  }, STEP_DURATION_MS);
}

/* Состояние формы */
function resetForm() {
  osNameInput.value = "";
  selectedFileName = null;
  fileInput.value = "";
  fileSelectedNode.classList.add("hidden");
  fileSelectedNode.textContent = "";
  fileErrorNode.classList.add("hidden");
  fileErrorNode.textContent = "";
  updateSubmitState();
}

function updateSubmitState() {
  createButton.disabled = !(osNameInput.value.trim() && selectedFileName);
}

function openDialog() {
  resetForm();
  showScreen("workspace");
  dialogOverlay.classList.remove("hidden");
  osNameInput.focus();
}

function closeDialog() {
  dialogOverlay.classList.add("hidden");
  resetForm();
}

/* Валидация расширения, как в EmulatorUiStateHolder.onImageSelected */
function handleFileSelection(fileName) {
  const lowerName = (fileName || "").toLowerCase();
  if (!lowerName.endsWith(".iso") && !lowerName.endsWith(".img")) {
    selectedFileName = null;
    fileSelectedNode.classList.add("hidden");
    fileErrorNode.textContent = "Поддерживаются только файлы с расширением .iso или .img";
    fileErrorNode.classList.remove("hidden");
  } else {
    selectedFileName = fileName;
    fileErrorNode.classList.add("hidden");
    fileSelectedNode.textContent = "Выбран файл: " + fileName;
    fileSelectedNode.classList.remove("hidden");
  }
  updateSubmitState();
}

/* Материальная рябь на плитке */
function createRipple(event, host) {
  const rect = host.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement("span");
  ripple.className = "ripple";
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = (event.clientX - rect.left - size / 2) + "px";
  ripple.style.top = (event.clientY - rect.top - size / 2) + "px";
  host.appendChild(ripple);
  setTimeout(() => ripple.remove(), 520);
}

/* Добавление плитки созданной конфигурации в сетку */
function createConfiguration() {
  if (createButton.disabled) return;
  const configuration = document.createElement("div");
  configuration.className = "tile tileConfig";
  configuration.dataset.id = String(nextConfigurationId++);
  const icon = document.createElement("div");
  icon.innerHTML = '<svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path fill="#F8F9FA" stroke="#1A73E8" stroke-width="2" stroke-linejoin="round" d="M12,4 L29,4 L37,12 L37,40 A4,4 0 0 1 33,44 L12,44 A4,4 0 0 1 8,40 L8,8 A4,4 0 0 1 12,4 Z"></path><path fill="#F1F3F4" stroke="#1A73E8" stroke-width="2" stroke-linejoin="round" d="M29,4 L29,12 L37,12 Z"></path><path fill="#1A73E8" d="M14,21 H34 V23 H14 Z"></path><path fill="#DADCE0" d="M14,27 H34 V29 H14 Z"></path><path fill="#DADCE0" d="M14,33 H28 V35 H14 Z"></path></svg>';
  const text = document.createElement("div");
  const name = document.createElement("div");
  name.className = "configName";
  name.textContent = osNameInput.value.trim();
  const file = document.createElement("div");
  file.className = "configFile";
  file.textContent = selectedFileName;
  text.append(name, file);
  configuration.append(icon, text);
  grid.insertBefore(configuration, plusTile);
  brandCounter.textContent = "Конфигураций: " + (nextConfigurationId - 1);
  closeDialog();
}

/* Привязка событий интерфейса */
plusTile.addEventListener("click", (event) => {
  createRipple(event, plusTile);
  openDialog();
});
plusTile.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") openDialog();
});
fileBox.addEventListener("click", (event) => {
  createRipple(event, fileBox);
  fileInput.click();
});
fileBox.addEventListener("keydown", (event) => {
  if (event.key === "Enter" || event.key === " ") fileInput.click();
});
fileInput.addEventListener("change", () => {
  if (fileInput.files.length > 0) handleFileSelection(fileInput.files[0].name);
});
osNameInput.addEventListener("input", updateSubmitState);
cancelButton.addEventListener("click", closeDialog);
createButton.addEventListener("click", createConfiguration);
dialogOverlay.addEventListener("click", (event) => {
  if (event.target === dialogOverlay) closeDialog();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !dialogOverlay.classList.contains("hidden")) closeDialog();
});

/* Навигация по макету */
document.querySelectorAll(".demoNav button").forEach((button) => {
  button.addEventListener("click", () => {
    const view = button.dataset.view;
    if (view === "loader") { closeDialog(); startLoader(); }
    if (view === "workspace") { clearInterval(bootTimer); closeDialog(); showScreen("workspace"); }
    if (view === "dialog") { clearInterval(bootTimer); openDialog(); }
    if (view === "reset") {
      grid.querySelectorAll(".tileConfig").forEach((tile) => tile.remove());
      nextConfigurationId = 1;
      brandCounter.textContent = "Конфигураций: 0";
      closeDialog();
      startLoader();
    }
  });
});

startLoader();
</script>
</body>
</html>
